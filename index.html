<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEGEND CREW</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#000;color:#fff;text-align:center;padding:20px}
h1{font-size:42px;letter-spacing:5px;margin:20px 0 5px}
p.sub{color:#aaa;margin-bottom:30px}
.grid{display:flex;flex-direction:column;gap:25px;max-width:400px;margin:0 auto}
.card{background:#111;border:1px solid #222;border-radius:20px;overflow:hidden;padding-bottom:20px}
.card img{width:100%;height:320px;object-fit:cover}
.card h2{font-size:28px;margin:15px 0 5px;letter-spacing:3px}
.card p{color:#888}
.oshuzz h2{color:#ff2d2d}
.niko h2{color:#00e5ff}
.suwa h2{color:#ffcc00}
.btn{display:inline-block;margin-top:30px;background:#fff;color:#000;padding:12px 25px;border-radius:30px;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<h1>LEGEND CREW</h1>
<p class="sub">Admin • OSHUZZ • NIKO • SUWA</p>
<div class="grid">
<div class="card oshuzz">
<img src="0bcbe4fb-3bef-4a17-aba7-50af2b33ef0d.jpeg">
<h2>OSHUZZ</h2>
<p>Admin - Oshan Pasindu</p>
</div>
<div class="card niko">
<img src="1bc4d65f-32f0-441b-b246-590809c01fea.jpeg">
<h2>NIKO</h2>
<p>Legend Crew</p>
</div>
<div class="card suwa">
<img src="2383150e-f9d2-4b6c-8db0-2a7b1e282a14.jpeg">
<h2>SUWA</h2>
<p>Legend Crew</p>
</div>
</div>
<a class="btn" href="#">Join Legend Crew</a>
</body>
</html>
